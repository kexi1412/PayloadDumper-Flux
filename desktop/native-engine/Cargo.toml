[package]
name = "flux-native-engine"
version = "3.2.0-pc.1"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "In-process, bounded native firmware extraction engine for PayloadDumper Flux"
build = "build.rs"

[lib]
name = "flux_native_engine"
path = "src/lib.rs"

[[bin]]
name = "flux-native-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"
sha2 = "0.10"
crc32fast = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
bzip2 = { version = "0.4", features = ["static"] }
xz2 = { version = "0.1", features = ["static"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
