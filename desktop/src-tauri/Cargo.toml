[package]
name = "flux-desktop"
version = "3.2.0-pc.1"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
description = "Payload Dumper Flux native desktop workbench"
build = "build.rs"

[[bin]]
name = "payload-dumper-flux"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "compression", "common-controls-v6"] }
tauri-plugin-single-instance = "=2.5.5"
flux-native-engine = { path = "../native-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
rfd = { version = "=0.15.4", default-features = false }

[dev-dependencies]
tempfile = "3"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
