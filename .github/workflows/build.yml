name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read application version
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test -n "$VERSION"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          chmod +x ./gradlew

      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebugAndroidTest assembleRelease --no-daemon --stacktrace

      - name: Enable emulator hardware acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Verify Android theme and dialogs on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >-
            status=0;
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace || status=$?;
            mkdir -p ui-screenshots;
            adb pull /sdcard/Android/data/com.flux.payload.dumper.debug/files/theme-regression ui-screenshots/ || true;
            exit "$status"

      - name: Upload Android UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PayloadDumper-Flux-Android-UI
          path: ui-screenshots/
          if-no-files-found: warn

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PayloadDumper-Flux-test-reports
          path: |
            app/build/test-results/
            app/build/reports/
          if-no-files-found: warn

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.FLUX_SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.FLUX_SIGNING_PASSWORD }}
        run: |
          set -e
          umask 077
          if [ -n "$KEYSTORE_B64" ] && [ -n "$SIGNING_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > release.p12
            echo 'Using persistent release certificate'
          elif [ -n "$KEYSTORE_B64" ] || [ -n "$SIGNING_PASSWORD" ]; then
            echo 'Both FLUX_SIGNING_KEYSTORE_B64 and FLUX_SIGNING_PASSWORD must be configured' >&2
            exit 1
          else
            # Forks without signing secrets still get a build, but not an upgrade-compatible key.
            echo '::warning::No persistent signing secrets; generating an ephemeral certificate'
            SIGNING_PASSWORD=$(openssl rand -hex 24)
            echo "::add-mask::$SIGNING_PASSWORD"
            keytool -genkeypair -keystore release.p12 -storetype PKCS12 \
              -storepass:env SIGNING_PASSWORD -keypass:env SIGNING_PASSWORD -alias flux \
              -keyalg RSA -keysize 3072 -validity 10000 \
              -dname 'CN=Payload Dumper Flux, OU=Flux, O=Flux, C=CN'
          fi
          printf '%s' "$SIGNING_PASSWORD" > signing-password.txt
        shell: bash

      - name: Zipalign, sign and verify
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/35.0.0"
          # Use the password selected by the keystore step for both persistent and fallback keys.
          export FLUX_SIGN_PASS="$(<signing-password.txt)"
          test -n "$FLUX_SIGN_PASS"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.p12 --ks-key-alias flux \
            --ks-pass env:FLUX_SIGN_PASS --key-pass env:FLUX_SIGN_PASS \
            --out "PayloadDumper-Flux-${{ steps.version.outputs.name }}.apk" aligned.apk
          "$BT/apksigner" verify --verbose --print-certs "PayloadDumper-Flux-${{ steps.version.outputs.name }}.apk"
          sha256sum PayloadDumper-Flux-*.apk > SHA256SUMS.txt

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PayloadDumper-Flux-apk
          path: |
            PayloadDumper-Flux-*.apk
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[no-release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Payload Dumper Flux ${{ steps.version.outputs.name }}
          body_path: CHANGELOG.md
          files: |
            PayloadDumper-Flux-*.apk
            SHA256SUMS.txt
          generate_release_notes: true

      - name: Clean temporary signing files
        if: always()
        run: rm -f release.p12 signing-password.txt aligned.apk
